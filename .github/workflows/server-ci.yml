name: Server CI/CD

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'server/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'server/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./server/gtg-update-server

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: server/gtg-update-server/package-lock.json
        
    - name: Install dependencies
      run: npm install
      
    - name: Run Type Check
      run: npx tsc --noEmit
